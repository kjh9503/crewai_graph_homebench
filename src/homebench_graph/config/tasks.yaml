interpret_user_story_task:
  description: >
    Read the user_story (resident meta info/preferences) and extract actionable policies.
    
    User Story:
    {user_story}
    
    Output MUST be a JSON object (no markdown fences) with keys:
      - temp_pref: object or null (e.g., sleep_range array with min and max, default_sleep number)
      - light_pref: object or null (e.g., sleep_brightness number, preferred_color string)
      - airflow_pref: object or null (e.g., avoid_strong_fan boolean)
      - noise_pref: object or null (e.g., avoid_loud_devices_at_night boolean)
      - hard_constraints: list of strings (e.g., "do not use heater", "no bright light after 11pm")
      - notes: list of strings
    Only extract what is explicitly supported by the story. Do not guess.
  expected_output: >
    A single JSON object describing user policies.
  agent: user_profile_interpreter

interpret_context_task:
  description: >
    Read perception.contexts and infer a structured intent.
    
    Perception Contexts:
    {perception_contexts}
    
    Output MUST be a JSON object (no markdown fences) with keys:
      - room_hint: string or null (e.g., "master_bedroom")
      - discomfort: short string (e.g., "too warm and stagnant air")
      - desired_change: one of ["cool_down","warm_up","brighten","dim","turn_on","turn_off","change_color","reduce_noise","increase_airflow","other"]
      - intensity: one of ["low","medium","high"]
      - time_hint: string or null (e.g., "night/sleep")
      - assumptions: list of short strings (empty list if none)
    Do not mention any device names here; focus only on intent.
  expected_output: >
    A single JSON object describing the inferred intent.
  agent: context_interpreter

