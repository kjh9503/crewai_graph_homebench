write_command_task:
  description: >
    Write EXACTLY ONE natural language instruction (a single sentence) that matches HomeBench input style.
    Requirements:
      - Must explicitly mention the room and device (e.g., "in the master bedroom", "air conditioner").
      - Must reflect the selected operation and params.
      - Use imperative phrasing (e.g., "Lower...", "Set...", "Turn on...").
      - Do not output code, tool calls, or quotes.
    Use this style guidance:
      - set_temperature: "Set the temperature of the air conditioner in the [room name] to [temperature] degrees."
        or "Lower the temperature of the air conditioner in the [room name] to [temperature] degrees."
      - set_brightness: "Dim the light in the [room name] to [brightness] percent."
      - turn_on/off: "Turn on/off the [device name] in the [room name]."
  expected_output: >
    A single natural language instruction string.
  agent: command_writer
  # context:
  #   - plan_action_task

validate_and_finalize_task:
  description: >
    Validate the generated instruction against the plan, capabilities, AND user policies.
    Output MUST be a JSON object with keys:
      - is_valid, final_command, issues
    Add checks:
      - The chosen parameters do not violate user hard_constraints.
      - If user has an explicit preference relevant to the action (e.g., sleep temp range),
        the command follows it (or explain in issues why it could not).
  expected_output: >
    A single JSON object with validity and the final command.
  agent: command_critic
  context:
    - interpret_user_story_task
    # - plan_action_task
    - write_command_task
