[project]
name = "homebench_graph"
version = "0.1.0"
description = "homebench_graph using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3"
]

[project.scripts]
homebench_graph = "homebench_graph.main:run"
run_crew = "homebench_graph.main:run"
train = "homebench_graph.main:train"
replay = "homebench_graph.main:replay"
test = "homebench_graph.main:test"
run_with_trigger = "homebench_graph.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
